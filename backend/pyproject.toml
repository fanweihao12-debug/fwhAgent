[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "范伟豪",email = "fanwh@asiainfo-sec.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.135.3,<0.136.0)",
    "uvicorn (>=0.44.0,<0.45.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "langchain (>=1.2.15,<2.0.0)",
    "langchain-core (>=1.2.28,<2.0.0)",
    "langchain-text-splitters (>=1.1.1,<2.0.0)",
    "sentence-transformers (>=5.1.2,<6.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pypdf (>=5.4.0,<6.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "redis (>=7.4.0,<8.0.0)",
    "aio-pika (>=9.6.2,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.9,<0.16.0)",
    "black (>=26.3.1,<27.0.0)"
]
